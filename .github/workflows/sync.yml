name: Turev Araç Senkronizasyonu

on:
  schedule:
    - cron: '* * * * *' # Her dakika çalışır (Dakika: her, Saat: her)
  workflow_dispatch: # Sizin de GitHub üzerinden manuel olarak tek tıkla çalıştırabilmeniz için

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub'a kod kaydedebilmesi için yazma izni
    
    steps:
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4
        
      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Gerekli Paketleri Yükle
        run: npm install
        
      - name: Tarayıcıyı (Chrome) Kur
        run: npx playwright install --with-deps chromium
        
      - name: Botu Çalıştır (Türev'den Araçları Çek)
        run: npx tsx src/scripts/syncCars.ts
        env:
          TUREV_COMPANY_USERNAME: ${{ secrets.TUREV_COMPANY_USERNAME }}
          TUREV_COMPANY_PASSWORD: ${{ secrets.TUREV_COMPANY_PASSWORD }}
          TUREV_USER_USERNAME: ${{ secrets.TUREV_USER_USERNAME }}
          TUREV_USER_PASSWORD: ${{ secrets.TUREV_USER_PASSWORD }}
        
      - name: Yeni Araçları Sisteme (Buluta) Kaydet
        run: |
          git config --global user.name "BNA Bot (Otomatik)"
          git config --global user.email "bot@bnarentacar.com"
          git add src/data/cars.json
          git commit -m "Otomatik Güncelleme: Türev araçları senkronize edildi" || echo "Değişiklik yok, güncellenmedi."
          git push
